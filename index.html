<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qabiil Tracker</title>
<style>
  :root {
    /* Colour tokens */
    --color-bg: #f5f3ee;
    --color-surface: #ffffff;
    --color-border: #d8d3c8;
    --color-text: #23201b;
    --color-text-muted: #6b6459;
    --color-accent: #7a5c3e;
    --color-accent-contrast: #ffffff;

    /* Typography tokens */
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    --font-size-base: 1rem;
    --font-size-lg: 1.375rem;
    --font-size-sm: 0.875rem;

    /* Spacing tokens */
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 1rem;
    --space-4: 1.5rem;
    --space-5: 2.5rem;

    /* Shape tokens */
    --radius: 8px;
    --header-height: 3.5rem;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    font-family: var(--font-sans);
    font-size: var(--font-size-base);
    color: var(--color-text);
    background: var(--color-bg);
  }

  .app-header {
    display: flex;
    align-items: center;
    height: var(--header-height);
    padding: 0 var(--space-4);
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }

  .app-header h1 {
    margin: 0;
    font-size: var(--font-size-lg);
    font-weight: 600;
  }

  .app-body {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  .sidebar {
    width: 20rem;
    flex-shrink: 0;
    padding: var(--space-4);
    background: var(--color-surface);
    border-right: 1px solid var(--color-border);
    overflow-y: auto;
  }

  .sidebar h2 {
    margin-top: 0;
    font-size: var(--font-size-sm);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-text-muted);
  }

  .canvas {
    flex: 1;
    position: relative;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .canvas .placeholder {
    color: var(--color-text-muted);
    font-size: var(--font-size-sm);
  }
</style>
</head>
<body>
  <header class="app-header">
    <h1>Qabiil Tracker</h1>
  </header>
  <div class="app-body">
    <aside id="sidebar" class="sidebar">
      <h2>Records</h2>
      <p class="placeholder">Person forms, search, and the ledger will live here.</p>
    </aside>
    <main id="canvas" class="canvas">
      <p class="placeholder">Your pedigree tree will render here.</p>
    </main>
  </div>
</body>
</html>
