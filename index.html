<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qabiil Tracker</title>
<style>
  :root {
    /* Colour tokens */
    --color-bg: #f5f3ee;
    --color-surface: #ffffff;
    --color-border: #d8d3c8;
    --color-text: #23201b;
    --color-text-muted: #6b6459;
    --color-accent: #7a5c3e;
    --color-accent-contrast: #ffffff;
    --color-danger: #b3261e;

    /* Typography tokens */
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    --font-size-base: 1rem;
    --font-size-lg: 1.375rem;
    --font-size-sm: 0.875rem;

    /* Spacing tokens */
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 1rem;
    --space-4: 1.5rem;
    --space-5: 2.5rem;

    /* Shape tokens */
    --radius: 8px;
    --header-height: 3.5rem;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    font-family: var(--font-sans);
    font-size: var(--font-size-base);
    color: var(--color-text);
    background: var(--color-bg);
  }

  .app-header {
    display: flex;
    align-items: center;
    height: var(--header-height);
    padding: 0 var(--space-4);
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }

  .app-header h1 {
    margin: 0;
    font-size: var(--font-size-lg);
    font-weight: 600;
  }

  .app-body {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  .sidebar {
    width: 20rem;
    flex-shrink: 0;
    padding: var(--space-4);
    background: var(--color-surface);
    border-right: 1px solid var(--color-border);
    overflow-y: auto;
  }

  .sidebar h2 {
    margin-top: 0;
    font-size: var(--font-size-sm);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-text-muted);
  }

  .canvas {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: safe center;
    justify-content: safe center;
    touch-action: none;
    cursor: grab;
  }

  .canvas.panning {
    cursor: grabbing;
  }

  .canvas .placeholder {
    color: var(--color-text-muted);
    font-size: var(--font-size-sm);
  }

  .person-form {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .field label {
    font-size: var(--font-size-sm);
    color: var(--color-text-muted);
  }

  .field input,
  .field select {
    font: inherit;
    color: var(--color-text);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-2);
  }

  .field input[aria-invalid="true"] {
    border-color: var(--color-danger);
  }

  .field textarea {
    font: inherit;
    color: var(--color-text);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-2);
    resize: vertical;
    min-height: 4rem;
  }

  .field-checkbox {
    flex-direction: row;
    align-items: center;
  }

  .field-checkbox label {
    color: var(--color-text);
    font-size: var(--font-size-base);
  }

  .photo-field {
    flex-direction: row;
    align-items: center;
    gap: var(--space-3);
  }

  .photo-preview {
    width: 3.5rem;
    height: 3.5rem;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--color-border);
    flex-shrink: 0;
  }

  .photo-field-controls {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    flex: 1;
  }

  .field-error {
    margin: 0;
    font-size: var(--font-size-sm);
    color: var(--color-danger);
  }

  .btn-primary {
    font: inherit;
    font-weight: 600;
    color: var(--color-accent-contrast);
    background: var(--color-accent);
    border: none;
    border-radius: var(--radius);
    padding: var(--space-2) var(--space-3);
    cursor: pointer;
    align-self: flex-start;
  }

  .btn-primary:hover {
    opacity: 0.9;
  }

  .btn-secondary {
    font: inherit;
    font-weight: 600;
    color: var(--color-accent);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-2) var(--space-3);
    cursor: pointer;
    margin-top: var(--space-2);
  }

  .btn-secondary:hover {
    border-color: var(--color-accent);
  }

  .tree-root {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-5);
    position: relative;
    transform-origin: center center;
  }

  .tree-tier {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: var(--space-4);
    position: relative;
    z-index: 1;
  }

  .tree-connectors {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .tree-connectors path {
    fill: none;
    stroke: var(--color-text-muted);
    stroke-width: 1.5;
  }

  .person-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-3);
    min-width: 12rem;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .person-card .person-name {
    font-weight: 600;
    margin-bottom: var(--space-1);
  }

  .person-card .person-detail {
    font-size: var(--font-size-sm);
    color: var(--color-text-muted);
  }

  .person-card-header {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin-bottom: var(--space-1);
  }

  .person-avatar {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
  }

  .person-avatar-initials {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--color-accent);
    color: var(--color-accent-contrast);
    font-weight: 600;
    font-size: var(--font-size-sm);
  }

  .person-card-header .person-name {
    margin-bottom: 0;
  }

  .person-card--deceased {
    background: var(--color-bg);
    border-style: dashed;
  }

  .person-card--deceased .person-avatar,
  .person-card--deceased .person-avatar-initials {
    filter: grayscale(1);
    opacity: 0.85;
  }

  .person-card--deceased .person-name::after {
    content: ' \2020';
    color: var(--color-text-muted);
    font-weight: 400;
  }

  .person-card .person-kinship {
    font-size: var(--font-size-sm);
    font-weight: 600;
    color: var(--color-accent);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: var(--space-1);
  }

  .person-card--clickable {
    cursor: pointer;
  }

  .person-card--clickable:hover {
    border-color: var(--color-accent);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
  }

  .person-slot-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 12rem;
    border: 1px dashed var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-3);
    color: var(--color-text-muted);
    font-size: var(--font-size-sm);
    text-align: center;
    cursor: pointer;
    background: transparent;
  }

  .person-slot-empty:hover {
    border-color: var(--color-accent);
    color: var(--color-accent);
  }

  .tree-controls,
  .sidebar-section {
    margin-bottom: var(--space-4);
    padding-bottom: var(--space-4);
    border-bottom: 1px solid var(--color-border);
  }

  .person-search-results {
    list-style: none;
    margin: var(--space-2) 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .person-search-result {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    font: inherit;
    text-align: left;
    color: var(--color-text);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-2);
    cursor: pointer;
  }

  .person-search-result:hover {
    border-color: var(--color-accent);
  }

  .person-search-result-detail {
    font-size: var(--font-size-sm);
    color: var(--color-text-muted);
  }

  .person-search-empty {
    margin: var(--space-2) 0 0;
    font-size: var(--font-size-sm);
    color: var(--color-text-muted);
  }

  .ledger-list {
    list-style: none;
    margin: var(--space-2) 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }

  .ledger-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-2);
    font-size: var(--font-size-sm);
  }

  .ledger-label {
    color: var(--color-text-muted);
  }

  .ledger-value {
    font-weight: 600;
    color: var(--color-text);
  }

  .field input[type="range"] {
    padding: 0;
    border: none;
    background: transparent;
    accent-color: var(--color-accent);
  }

  .tree-tier-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);
    width: 100%;
  }

  .tree-tier-label {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    width: 100%;
    color: var(--color-text-muted);
    font-size: var(--font-size-sm);
  }

  .tree-tier-label::before,
  .tree-tier-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--color-border);
  }

  .tree-tier-label-text {
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .tree-tier-count {
    white-space: nowrap;
  }
</style>
</head>
<body>
  <header class="app-header">
    <h1>Qabiil Tracker</h1>
  </header>
  <div class="app-body">
    <aside id="sidebar" class="sidebar">
      <div class="tree-controls">
        <h2>Tree view</h2>
        <div class="field">
          <label for="generations-slider">Generations back: <span id="generations-value"></span></label>
          <input type="range" id="generations-slider" min="1" max="10" step="1">
        </div>
        <button type="button" id="fit-to-screen-btn" class="btn-secondary">Fit to screen</button>
      </div>
      <div class="sidebar-section find-people">
        <h2>Find people</h2>
        <div class="field">
          <label for="person-search">Search by name</label>
          <input type="search" id="person-search" placeholder="e.g. Amina Yusuf">
        </div>
        <ul id="person-search-results" class="person-search-results"></ul>
        <p id="person-search-empty" class="person-search-empty" hidden>No matches.</p>
      </div>
      <div class="sidebar-section tree-ledger">
        <h2>Ledger</h2>
        <ul class="ledger-list">
          <li class="ledger-item">
            <span class="ledger-label">People recorded</span>
            <span class="ledger-value" id="ledger-total"></span>
          </li>
          <li class="ledger-item">
            <span class="ledger-label">Slots filled</span>
            <span class="ledger-value" id="ledger-slots"></span>
          </li>
          <li class="ledger-item">
            <span class="ledger-label">Deepest generation</span>
            <span class="ledger-value" id="ledger-deepest"></span>
          </li>
        </ul>
      </div>
      <h2 id="form-heading">Myself</h2>
      <form id="self-form" class="person-form" novalidate>
        <div class="field">
          <label for="self-given-name">Given name</label>
          <input type="text" id="self-given-name" name="givenName" required>
          <p class="field-error" id="self-given-name-error" hidden>Given name is required.</p>
        </div>
        <div class="field">
          <label for="self-family-name">Family name</label>
          <input type="text" id="self-family-name" name="familyName">
        </div>
        <div class="field">
          <label for="self-sex">Sex</label>
          <select id="self-sex" name="sex">
            <option value="">Unspecified</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
          </select>
        </div>
        <div class="field">
          <label for="self-birth-date">Birth date</label>
          <input type="date" id="self-birth-date" name="birthDate">
        </div>
        <div class="field">
          <label for="self-birth-place">Birth place</label>
          <input type="text" id="self-birth-place" name="birthPlace">
        </div>
        <div class="field">
          <label for="self-name-at-birth">Name at birth</label>
          <input type="text" id="self-name-at-birth" name="nameAtBirth">
        </div>
        <div class="field">
          <label for="self-occupation">Occupation</label>
          <input type="text" id="self-occupation" name="occupation">
        </div>
        <div class="field photo-field">
          <img id="self-photo-preview" class="photo-preview" alt="Photo preview" hidden>
          <div class="photo-field-controls">
            <label for="self-photo">Photo</label>
            <input type="file" id="self-photo" name="photo" accept="image/*">
            <button type="button" id="self-photo-remove" class="btn-secondary" hidden>Remove photo</button>
          </div>
        </div>
        <div class="field field-checkbox">
          <input type="checkbox" id="self-still-living" name="stillLiving" checked>
          <label for="self-still-living">Still living</label>
        </div>
        <div id="self-death-fields">
          <div class="field">
            <label for="self-death-date">Death date</label>
            <input type="date" id="self-death-date" name="deathDate">
          </div>
          <div class="field">
            <label for="self-death-place">Death place</label>
            <input type="text" id="self-death-place" name="deathPlace">
          </div>
        </div>
        <div class="field">
          <label for="self-notes">Notes</label>
          <textarea id="self-notes" name="notes"></textarea>
        </div>
        <div class="field">
          <label for="self-sources">Sources</label>
          <textarea id="self-sources" name="sources"></textarea>
        </div>
        <div class="field">
          <label for="self-label-override">Custom label (optional)</label>
          <input type="text" id="self-label-override" name="labelOverride" placeholder="Overrides the computed relationship label">
        </div>
        <button type="submit" class="btn-primary">Save</button>
      </form>
    </aside>
    <main id="canvas" class="canvas">
      <p class="placeholder" id="canvas-placeholder">Your pedigree tree will render here.</p>
      <div id="tree-root" class="tree-root" hidden></div>
    </main>
  </div>
  <script>
    (function () {
      var STORAGE_KEY = 'qabiiltracker.people';
      var MIN_GENERATIONS_BACK = 1;
      var MAX_GENERATIONS_BACK = 10;
      var DEFAULT_GENERATIONS_BACK = 4;

      function clampGenerationsBack(value) {
        value = parseInt(value, 10);
        if (isNaN(value)) return DEFAULT_GENERATIONS_BACK;
        return Math.min(MAX_GENERATIONS_BACK, Math.max(MIN_GENERATIONS_BACK, value));
      }

      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { people: {}, selfId: null, generationsBack: DEFAULT_GENERATIONS_BACK };
          var parsed = JSON.parse(raw);
          return {
            people: parsed.people || {},
            selfId: parsed.selfId || null,
            generationsBack: clampGenerationsBack(
              parsed.generationsBack != null ? parsed.generationsBack : DEFAULT_GENERATIONS_BACK
            ),
          };
        } catch (err) {
          return { people: {}, selfId: null, generationsBack: DEFAULT_GENERATIONS_BACK };
        }
      }

      function saveState(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      var state = loadState();
      var PARENT_ROLES = ['father', 'mother'];

      var form = document.getElementById('self-form');
      var formHeading = document.getElementById('form-heading');
      var givenNameInput = document.getElementById('self-given-name');
      var familyNameInput = document.getElementById('self-family-name');
      var sexInput = document.getElementById('self-sex');
      var birthDateInput = document.getElementById('self-birth-date');
      var birthPlaceInput = document.getElementById('self-birth-place');
      var labelOverrideInput = document.getElementById('self-label-override');
      var nameAtBirthInput = document.getElementById('self-name-at-birth');
      var occupationInput = document.getElementById('self-occupation');
      var notesInput = document.getElementById('self-notes');
      var sourcesInput = document.getElementById('self-sources');
      var stillLivingInput = document.getElementById('self-still-living');
      var deathFields = document.getElementById('self-death-fields');
      var deathDateInput = document.getElementById('self-death-date');
      var deathPlaceInput = document.getElementById('self-death-place');
      var photoInput = document.getElementById('self-photo');
      var photoPreview = document.getElementById('self-photo-preview');
      var photoRemoveBtn = document.getElementById('self-photo-remove');
      var givenNameError = document.getElementById('self-given-name-error');
      var placeholder = document.getElementById('canvas-placeholder');
      var treeRoot = document.getElementById('tree-root');
      var generationsSlider = document.getElementById('generations-slider');
      var generationsValue = document.getElementById('generations-value');
      var canvas = document.getElementById('canvas');
      var fitToScreenBtn = document.getElementById('fit-to-screen-btn');
      var personSearchInput = document.getElementById('person-search');
      var personSearchResults = document.getElementById('person-search-results');
      var personSearchEmpty = document.getElementById('person-search-empty');
      var ledgerTotal = document.getElementById('ledger-total');
      var ledgerSlots = document.getElementById('ledger-slots');
      var ledgerDeepest = document.getElementById('ledger-deepest');

      // Pan/zoom view of the canvas, applied as a CSS transform on
      // #tree-root and kept independent of the layout logic in buildTiers.
      var MIN_SCALE = 0.2;
      var MAX_SCALE = 4;
      var view = { scale: 1, panX: 0, panY: 0 };

      function applyTransform() {
        treeRoot.style.transform = 'translate(' + view.panX + 'px, ' + view.panY + 'px) scale(' + view.scale + ')';
      }

      // Rescales around the point (cx, cy), given in canvas-viewport
      // coordinates, so that the content under it stays put.
      function zoomAt(cx, cy, canvasRect, newScale) {
        newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
        var centerX = canvasRect.width / 2;
        var centerY = canvasRect.height / 2;
        var ratio = newScale / view.scale;
        view.panX = (cx - centerX) - ratio * (cx - view.panX - centerX);
        view.panY = (cy - centerY) - ratio * (cy - view.panY - centerY);
        view.scale = newScale;
        applyTransform();
      }

      function fitToScreen() {
        if (treeRoot.hidden) return;
        var rect = canvas.getBoundingClientRect();
        var naturalWidth = treeRoot.offsetWidth;
        var naturalHeight = treeRoot.offsetHeight;
        if (!naturalWidth || !naturalHeight) return;
        var newScale = Math.min(rect.width / naturalWidth, rect.height / naturalHeight) * 0.92;
        newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, Math.min(newScale, 1)));
        view.scale = newScale;
        view.panX = 0;
        view.panY = 0;
        applyTransform();
      }

      fitToScreenBtn.addEventListener('click', fitToScreen);

      canvas.addEventListener('wheel', function (event) {
        if (treeRoot.hidden) return;
        event.preventDefault();
        var rect = canvas.getBoundingClientRect();
        var cx = event.clientX - rect.left;
        var cy = event.clientY - rect.top;
        var newScale = view.scale * Math.exp(-event.deltaY * 0.0015);
        zoomAt(cx, cy, rect, newScale);
      }, { passive: false });

      function isInteractiveTarget(target) {
        return !!(target.closest && target.closest('.person-card, .person-slot-empty, button, input, select, textarea, a, label'));
      }

      function distanceBetween(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function midpoint(a, b) {
        return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      }

      // pointerId -> last known {x, y}; drives both single-pointer pan and
      // two-pointer pinch-zoom.
      var pointers = {};
      var panState = null;
      var pinchState = null;

      function startPan(pointerId, clientX, clientY) {
        panState = {
          pointerId: pointerId,
          startX: clientX,
          startY: clientY,
          startPanX: view.panX,
          startPanY: view.panY,
        };
        canvas.classList.add('panning');
      }

      canvas.addEventListener('pointerdown', function (event) {
        if (treeRoot.hidden) return;
        if (event.pointerType !== 'touch' && event.button !== 0) return;
        if (isInteractiveTarget(event.target)) return;

        try { canvas.setPointerCapture(event.pointerId); } catch (err) { /* pointer already gone */ }
        pointers[event.pointerId] = { x: event.clientX, y: event.clientY };

        var ids = Object.keys(pointers);
        if (ids.length === 2) {
          panState = null;
          canvas.classList.remove('panning');
          var pts = ids.map(function (id) { return pointers[id]; });
          pinchState = { lastDist: distanceBetween(pts[0], pts[1]) };
        } else if (ids.length === 1) {
          startPan(event.pointerId, event.clientX, event.clientY);
        }
      });

      canvas.addEventListener('pointermove', function (event) {
        if (!pointers[event.pointerId]) return;
        pointers[event.pointerId] = { x: event.clientX, y: event.clientY };

        var ids = Object.keys(pointers);
        var rect = canvas.getBoundingClientRect();

        if (ids.length === 2 && pinchState) {
          var pts = ids.map(function (id) { return pointers[id]; });
          var dist = distanceBetween(pts[0], pts[1]);
          if (pinchState.lastDist > 0 && dist > 0) {
            var mid = midpoint(pts[0], pts[1]);
            var newScale = view.scale * (dist / pinchState.lastDist);
            zoomAt(mid.x - rect.left, mid.y - rect.top, rect, newScale);
          }
          pinchState.lastDist = dist;
        } else if (panState && event.pointerId === panState.pointerId) {
          view.panX = panState.startPanX + (event.clientX - panState.startX);
          view.panY = panState.startPanY + (event.clientY - panState.startY);
          applyTransform();
        }
      });

      function releasePointer(event) {
        if (!pointers[event.pointerId]) return;
        delete pointers[event.pointerId];
        try { canvas.releasePointerCapture(event.pointerId); } catch (err) { /* already released */ }

        var ids = Object.keys(pointers);
        if (ids.length < 2) pinchState = null;
        if (panState && event.pointerId === panState.pointerId) {
          panState = null;
          canvas.classList.remove('panning');
        }
        if (ids.length === 1) {
          var remainingId = ids[0];
          startPan(Number(remainingId), pointers[remainingId].x, pointers[remainingId].y);
        }
      }

      canvas.addEventListener('pointerup', releasePointer);
      canvas.addEventListener('pointercancel', releasePointer);

      // Tracks which record the sidebar form is currently creating/editing.
      // role: 'self' | 'father' | 'mother'; childId: id of the person this
      // role is a parent of (only meaningful for father/mother roles).
      var editing = { role: 'self', personId: state.selfId, childId: null };

      // Holds a photo change staged in the form but not yet saved: either a
      // freshly downscaled data URL, or an explicit removal. Cleared
      // whenever the form is repopulated for a different record.
      var pendingPhoto = { dataUrl: null, removed: false };
      var MAX_PHOTO_DIMENSION = 240;

      function formatDate(isoDate) {
        var parts = isoDate.split('-').map(Number);
        var year = parts[0], month = parts[1], day = parts[2];
        if (!year || !month || !day) return isoDate;
        var d = new Date(Date.UTC(year, month - 1, day));
        return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });
      }

      function formatBirthDetails(person) {
        var parts = [];
        if (person.birthDate) parts.push(formatDate(person.birthDate));
        if (person.birthPlace) parts.push(person.birthPlace);
        return parts.join(' · ');
      }

      function isDeceased(person) {
        return person.stillLiving === false && !!(person.deathDate || person.deathPlace);
      }

      function formatDeathDetails(person) {
        var parts = [];
        if (person.deathDate) parts.push(formatDate(person.deathDate));
        if (person.deathPlace) parts.push(person.deathPlace);
        return parts.join(' · ');
      }

      function getInitials(person) {
        var letters = [person.givenName, person.familyName]
          .filter(Boolean)
          .map(function (part) { return part.trim().charAt(0).toUpperCase(); })
          .filter(Boolean);
        return letters.join('') || '?';
      }

      function capitalize(word) {
        return word.charAt(0).toUpperCase() + word.slice(1);
      }

      function getFullName(person) {
        return [person.givenName, person.familyName].filter(Boolean).join(' ') || 'Unnamed';
      }

      // Finds how a person is currently linked into the tree, so a search
      // result can be opened for editing the same way clicking its card
      // would. Every person in state.people is reachable from self via
      // father/mother links, so exactly one of these cases applies.
      function resolveEditContext(personId) {
        if (personId === state.selfId) return { role: 'self', childId: null };
        for (var id in state.people) {
          var candidate = state.people[id];
          if (candidate.fatherId === personId) return { role: 'father', childId: id };
          if (candidate.motherId === personId) return { role: 'mother', childId: id };
        }
        return { role: 'self', childId: null };
      }

      function renderSearchResults() {
        var query = personSearchInput.value.trim().toLowerCase();
        personSearchResults.innerHTML = '';
        if (!query) {
          personSearchEmpty.hidden = true;
          return;
        }

        var matches = Object.keys(state.people)
          .map(function (id) { return state.people[id]; })
          .filter(function (person) { return getFullName(person).toLowerCase().indexOf(query) !== -1; })
          .sort(function (a, b) { return getFullName(a).localeCompare(getFullName(b)); });

        matches.forEach(function (person) {
          var item = document.createElement('li');
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'person-search-result';

          var name = document.createElement('span');
          name.textContent = getFullName(person);
          button.appendChild(name);

          var details = formatBirthDetails(person);
          if (details) {
            var detail = document.createElement('span');
            detail.className = 'person-search-result-detail';
            detail.textContent = details;
            button.appendChild(detail);
          }

          button.addEventListener('click', function () {
            var context = resolveEditContext(person.id);
            selectEditing(context.role, person.id, context.childId);
          });

          item.appendChild(button);
          personSearchResults.appendChild(item);
        });

        personSearchEmpty.hidden = matches.length > 0;
      }

      personSearchInput.addEventListener('input', renderSearchResults);

      // Slot counts read off the same buildTiers() structure used for
      // rendering (#4): a branch with no recorded ancestor doesn't expand
      // further, so "total possible" reflects the tree as actually linked,
      // not a full binary count.
      function renderLedger() {
        var totalPeople = Object.keys(state.people).length;
        var self = state.selfId ? state.people[state.selfId] : null;
        var filledSlots = 0;
        var totalSlots = 0;
        var deepestGeneration = 0;

        if (self) {
          var tiers = buildTiers(self, state.generationsBack);
          for (var i = 1; i < tiers.length; i++) {
            var tierFilled = tiers[i].filter(function (entry) { return !!entry.person; }).length;
            filledSlots += tierFilled;
            totalSlots += tiers[i].length;
            if (tierFilled > 0) deepestGeneration = i;
          }
        }

        ledgerTotal.textContent = totalPeople;
        ledgerSlots.textContent = filledSlots + ' of ' + totalSlots;
        ledgerDeepest.textContent = deepestGeneration;
      }

      // Pure function of the path of father/mother steps from the focus
      // person down to an ancestor, e.g. ['father', 'mother'] -> "Paternal
      // grandmother". Kept independent of any particular focus person so
      // re-centering (#10) can reuse it against a different path.
      function computeKinshipLabel(path) {
        if (!path.length) return '';
        if (path.length === 1) return capitalize(path[0]);
        var side = path[0] === 'father' ? 'Paternal' : 'Maternal';
        var sex = path[path.length - 1];
        var greatPrefix = '';
        for (var i = 0; i < path.length - 2; i++) greatPrefix += 'great-';
        return side + ' ' + greatPrefix + 'grand' + sex;
      }

      function tierLabel(depth) {
        if (depth === 1) return 'Parents';
        var greatPrefix = '';
        for (var i = 0; i < depth - 2; i++) greatPrefix += 'great-';
        return capitalize(greatPrefix + 'grandparents');
      }

      function renderPersonCard(person, kinshipLabel) {
        var card = document.createElement('div');
        card.className = 'person-card';
        card.dataset.personId = person.id;
        var deceased = isDeceased(person);
        if (deceased) card.classList.add('person-card--deceased');

        if (kinshipLabel) {
          var kinship = document.createElement('div');
          kinship.className = 'person-kinship';
          kinship.textContent = kinshipLabel;
          card.appendChild(kinship);
        }

        var header = document.createElement('div');
        header.className = 'person-card-header';

        if (person.photo) {
          var avatar = document.createElement('img');
          avatar.className = 'person-avatar';
          avatar.src = person.photo;
          avatar.alt = '';
          header.appendChild(avatar);
        } else {
          var initials = document.createElement('div');
          initials.className = 'person-avatar-initials';
          initials.textContent = getInitials(person);
          header.appendChild(initials);
        }

        var name = document.createElement('div');
        name.className = 'person-name';
        name.textContent = getFullName(person);
        header.appendChild(name);
        card.appendChild(header);

        var details = formatBirthDetails(person);
        if (details) {
          var detail = document.createElement('div');
          detail.className = 'person-detail';
          detail.textContent = details;
          card.appendChild(detail);
        }

        if (deceased) {
          var deathDetails = formatDeathDetails(person);
          if (deathDetails) {
            var deathDetail = document.createElement('div');
            deathDetail.className = 'person-detail';
            deathDetail.textContent = deathDetails;
            card.appendChild(deathDetail);
          }
        }

        return card;
      }

      function selectEditing(role, personId, childId) {
        editing = { role: role, personId: personId || null, childId: childId || null };
        formHeading.textContent = role === 'self' ? 'Myself' : capitalize(role);
        populateForm(personId ? state.people[personId] : null);
      }

      function renderSlot(role, person, childId, path) {
        var el;
        if (person) {
          var kinshipLabel = person.labelOverride || computeKinshipLabel(path);
          el = renderPersonCard(person, kinshipLabel);
          el.classList.add('person-card--clickable');
        } else {
          el = document.createElement('div');
          el.className = 'person-slot-empty';
          el.textContent = '+ Add ' + capitalize(role);
        }
        el.addEventListener('click', function () {
          selectEditing(role, person ? person.id : null, childId);
        });
        return el;
      }

      // rect coordinates are in viewport pixels, already scaled by the
      // canvas pan/zoom transform on #tree-root; dividing by the current
      // scale recovers the untransformed local coordinates that the SVG
      // (itself inside the transformed subtree) draws in.
      function elementCenter(el, edge, rootRect, scale) {
        var rect = el.getBoundingClientRect();
        return {
          x: (rect.left + rect.width / 2 - rootRect.left) / scale,
          y: ((edge === 'top' ? rect.top : rect.bottom) - rootRect.top) / scale,
        };
      }

      function drawConnector(svg, from, to) {
        var midY = from.y + (to.y - from.y) / 2;
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        var d = 'M ' + from.x + ' ' + from.y +
          ' V ' + midY +
          ' H ' + to.x +
          ' V ' + to.y;
        path.setAttribute('d', d);
        svg.appendChild(path);
      }

      // Builds a list of tiers, tiers[0] being self and each subsequent tier
      // the father/mother slots of the previous tier's filled entries.
      // Recursion stops on an empty slot: an unfilled ancestor gets no
      // slots drawn above it, since there is no linked person to attach to.
      function buildTiers(self, generationsBack) {
        var tiers = [[{ key: 'self', person: self, role: 'self', childKey: null, childId: null, path: [] }]];
        var currentTier = tiers[0];
        for (var depth = 0; depth < generationsBack; depth++) {
          var nextTier = [];
          currentTier.forEach(function (entry) {
            if (!entry.person) return;
            PARENT_ROLES.forEach(function (role) {
              var parentId = entry.person[role + 'Id'];
              nextTier.push({
                key: entry.key + '.' + role,
                person: parentId ? state.people[parentId] : null,
                role: role,
                childKey: entry.key,
                childId: entry.person.id,
                path: entry.path.concat(role),
              });
            });
          });
          if (!nextTier.length) break;
          tiers.push(nextTier);
          currentTier = nextTier;
        }
        return tiers;
      }

      function renderCanvas() {
        renderSearchResults();
        renderLedger();
        treeRoot.innerHTML = '';
        var self = state.selfId ? state.people[state.selfId] : null;
        if (!self) {
          placeholder.hidden = false;
          treeRoot.hidden = true;
          return;
        }
        placeholder.hidden = true;
        treeRoot.hidden = false;
        applyTransform();

        var tiers = buildTiers(self, state.generationsBack);

        var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'tree-connectors');
        treeRoot.appendChild(svg);

        var elementsByKey = {};
        for (var i = tiers.length - 1; i >= 0; i--) {
          var tierGroup = document.createElement('div');
          tierGroup.className = 'tree-tier-group';

          if (i > 0) {
            var filledCount = tiers[i].filter(function (entry) { return !!entry.person; }).length;
            var totalCount = tiers[i].length;
            var labelEl = document.createElement('div');
            labelEl.className = 'tree-tier-label';
            var labelText = document.createElement('span');
            labelText.className = 'tree-tier-label-text';
            labelText.textContent = tierLabel(i);
            var labelCount = document.createElement('span');
            labelCount.className = 'tree-tier-count';
            labelCount.textContent = filledCount + ' of ' + totalCount + ' filled';
            labelEl.appendChild(labelText);
            labelEl.appendChild(labelCount);
            tierGroup.appendChild(labelEl);
          }

          var tierEl = document.createElement('div');
          tierEl.className = 'tree-tier';
          tiers[i].forEach(function (entry) {
            var el;
            if (entry.role === 'self') {
              el = renderPersonCard(entry.person);
              el.classList.add('person-card--clickable');
              el.addEventListener('click', function () {
                selectEditing('self', entry.person.id, null);
              });
            } else {
              el = renderSlot(entry.role, entry.person, entry.childId, entry.path);
            }
            el.dataset.entryKey = entry.key;
            elementsByKey[entry.key] = el;
            tierEl.appendChild(el);
          });
          tierGroup.appendChild(tierEl);
          treeRoot.appendChild(tierGroup);
        }

        var rootRect = treeRoot.getBoundingClientRect();
        tiers.forEach(function (tier) {
          tier.forEach(function (entry) {
            if (!entry.childKey) return;
            var from = elementCenter(elementsByKey[entry.key], 'bottom', rootRect, view.scale);
            var to = elementCenter(elementsByKey[entry.childKey], 'top', rootRect, view.scale);
            drawConnector(svg, from, to);
          });
        });
      }

      function updateStillLivingUI() {
        var stillLiving = stillLivingInput.checked;
        deathFields.hidden = stillLiving;
        deathDateInput.disabled = stillLiving;
        deathPlaceInput.disabled = stillLiving;
      }

      stillLivingInput.addEventListener('change', updateStillLivingUI);

      function updatePhotoPreview(dataUrl) {
        if (dataUrl) {
          photoPreview.src = dataUrl;
          photoPreview.hidden = false;
          photoRemoveBtn.hidden = false;
        } else {
          photoPreview.src = '';
          photoPreview.hidden = true;
          photoRemoveBtn.hidden = true;
        }
      }

      // Draws the loaded image onto an off-screen canvas at a bounded size
      // so the resulting data URL stays small enough for localStorage.
      function downscaleImage(img) {
        var scale = Math.min(1, MAX_PHOTO_DIMENSION / img.width, MAX_PHOTO_DIMENSION / img.height);
        var width = Math.max(1, Math.round(img.width * scale));
        var height = Math.max(1, Math.round(img.height * scale));
        var offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = width;
        offscreenCanvas.height = height;
        offscreenCanvas.getContext('2d').drawImage(img, 0, 0, width, height);
        return offscreenCanvas.toDataURL('image/jpeg', 0.85);
      }

      photoInput.addEventListener('change', function () {
        var file = photoInput.files && photoInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var img = new Image();
          img.onload = function () {
            var dataUrl = downscaleImage(img);
            pendingPhoto = { dataUrl: dataUrl, removed: false };
            updatePhotoPreview(dataUrl);
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      photoRemoveBtn.addEventListener('click', function () {
        pendingPhoto = { dataUrl: null, removed: true };
        photoInput.value = '';
        updatePhotoPreview(null);
      });

      function populateForm(person) {
        givenNameInput.value = person ? person.givenName || '' : '';
        familyNameInput.value = person ? person.familyName || '' : '';
        sexInput.value = person ? person.sex || '' : '';
        birthDateInput.value = person ? person.birthDate || '' : '';
        birthPlaceInput.value = person ? person.birthPlace || '' : '';
        nameAtBirthInput.value = person ? person.nameAtBirth || '' : '';
        occupationInput.value = person ? person.occupation || '' : '';
        notesInput.value = person ? person.notes || '' : '';
        sourcesInput.value = person ? person.sources || '' : '';
        deathDateInput.value = person ? person.deathDate || '' : '';
        deathPlaceInput.value = person ? person.deathPlace || '' : '';
        stillLivingInput.checked = person ? person.stillLiving !== false : true;
        updateStillLivingUI();
        labelOverrideInput.value = person ? person.labelOverride || '' : '';
        photoInput.value = '';
        pendingPhoto = { dataUrl: null, removed: false };
        updatePhotoPreview(person ? person.photo || null : null);
        givenNameError.hidden = true;
        givenNameInput.removeAttribute('aria-invalid');
      }

      function generateId() {
        return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var givenName = givenNameInput.value.trim();

        if (!givenName) {
          givenNameError.hidden = false;
          givenNameInput.setAttribute('aria-invalid', 'true');
          givenNameInput.focus();
          return;
        }
        givenNameError.hidden = true;
        givenNameInput.removeAttribute('aria-invalid');

        var id = editing.personId || generateId();
        var existing = state.people[id] || {};
        var photo = pendingPhoto.removed ? null : (pendingPhoto.dataUrl || existing.photo || null);
        var person = {
          id: id,
          givenName: givenName,
          familyName: familyNameInput.value.trim(),
          sex: sexInput.value,
          birthDate: birthDateInput.value,
          birthPlace: birthPlaceInput.value.trim(),
          nameAtBirth: nameAtBirthInput.value.trim(),
          occupation: occupationInput.value.trim(),
          notes: notesInput.value.trim(),
          sources: sourcesInput.value.trim(),
          stillLiving: stillLivingInput.checked,
          deathDate: stillLivingInput.checked ? '' : deathDateInput.value,
          deathPlace: stillLivingInput.checked ? '' : deathPlaceInput.value.trim(),
          photo: photo,
          labelOverride: labelOverrideInput.value.trim(),
          fatherId: existing.fatherId || null,
          motherId: existing.motherId || null,
        };

        state.people[id] = person;

        if (editing.role === 'self') {
          state.selfId = id;
        } else if (editing.childId) {
          state.people[editing.childId][editing.role + 'Id'] = id;
        }

        editing.personId = id;
        saveState(state);
        populateForm(person);
        renderCanvas();
      });

      givenNameInput.addEventListener('input', function () {
        if (givenNameInput.value.trim()) {
          givenNameError.hidden = true;
          givenNameInput.removeAttribute('aria-invalid');
        }
      });

      window.addEventListener('resize', renderCanvas);

      function updateGenerationsDisplay() {
        generationsValue.textContent = state.generationsBack;
      }

      generationsSlider.addEventListener('input', function () {
        state.generationsBack = clampGenerationsBack(generationsSlider.value);
        updateGenerationsDisplay();
        saveState(state);
        renderCanvas();
      });

      generationsSlider.value = state.generationsBack;
      updateGenerationsDisplay();

      var initialSelf = state.selfId ? state.people[state.selfId] : null;
      populateForm(initialSelf);
      renderCanvas();
    })();
  </script>
</body>
</html>
