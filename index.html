<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qabiil Tracker</title>
<style>
  :root {
    /* Colour tokens */
    --color-bg: #f5f3ee;
    --color-surface: #ffffff;
    --color-border: #d8d3c8;
    --color-text: #23201b;
    --color-text-muted: #6b6459;
    --color-accent: #7a5c3e;
    --color-accent-contrast: #ffffff;
    --color-danger: #b3261e;

    /* Typography tokens */
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    --font-size-base: 1rem;
    --font-size-lg: 1.375rem;
    --font-size-sm: 0.875rem;

    /* Spacing tokens */
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 1rem;
    --space-4: 1.5rem;
    --space-5: 2.5rem;

    /* Shape tokens */
    --radius: 8px;
    --header-height: 3.5rem;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    font-family: var(--font-sans);
    font-size: var(--font-size-base);
    color: var(--color-text);
    background: var(--color-bg);
  }

  .app-header {
    display: flex;
    align-items: center;
    height: var(--header-height);
    padding: 0 var(--space-4);
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }

  .app-header h1 {
    margin: 0;
    font-size: var(--font-size-lg);
    font-weight: 600;
  }

  .app-body {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  .sidebar {
    width: 20rem;
    flex-shrink: 0;
    padding: var(--space-4);
    background: var(--color-surface);
    border-right: 1px solid var(--color-border);
    overflow-y: auto;
  }

  .sidebar h2 {
    margin-top: 0;
    font-size: var(--font-size-sm);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-text-muted);
  }

  .canvas {
    flex: 1;
    position: relative;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .canvas .placeholder {
    color: var(--color-text-muted);
    font-size: var(--font-size-sm);
  }

  .person-form {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .field label {
    font-size: var(--font-size-sm);
    color: var(--color-text-muted);
  }

  .field input,
  .field select {
    font: inherit;
    color: var(--color-text);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-2);
  }

  .field input[aria-invalid="true"] {
    border-color: var(--color-danger);
  }

  .field-error {
    margin: 0;
    font-size: var(--font-size-sm);
    color: var(--color-danger);
  }

  .btn-primary {
    font: inherit;
    font-weight: 600;
    color: var(--color-accent-contrast);
    background: var(--color-accent);
    border: none;
    border-radius: var(--radius);
    padding: var(--space-2) var(--space-3);
    cursor: pointer;
    align-self: flex-start;
  }

  .btn-primary:hover {
    opacity: 0.9;
  }

  .tree-root {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-5);
    position: relative;
  }

  .tree-tier {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: var(--space-4);
    position: relative;
    z-index: 1;
  }

  .tree-connectors {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .tree-connectors path {
    fill: none;
    stroke: var(--color-text-muted);
    stroke-width: 1.5;
  }

  .person-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-3);
    min-width: 12rem;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .person-card .person-name {
    font-weight: 600;
    margin-bottom: var(--space-1);
  }

  .person-card .person-detail {
    font-size: var(--font-size-sm);
    color: var(--color-text-muted);
  }

  .person-card--clickable {
    cursor: pointer;
  }

  .person-card--clickable:hover {
    border-color: var(--color-accent);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
  }

  .person-slot-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 12rem;
    border: 1px dashed var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-3);
    color: var(--color-text-muted);
    font-size: var(--font-size-sm);
    text-align: center;
    cursor: pointer;
    background: transparent;
  }

  .person-slot-empty:hover {
    border-color: var(--color-accent);
    color: var(--color-accent);
  }
</style>
</head>
<body>
  <header class="app-header">
    <h1>Qabiil Tracker</h1>
  </header>
  <div class="app-body">
    <aside id="sidebar" class="sidebar">
      <h2 id="form-heading">Myself</h2>
      <form id="self-form" class="person-form" novalidate>
        <div class="field">
          <label for="self-given-name">Given name</label>
          <input type="text" id="self-given-name" name="givenName" required>
          <p class="field-error" id="self-given-name-error" hidden>Given name is required.</p>
        </div>
        <div class="field">
          <label for="self-family-name">Family name</label>
          <input type="text" id="self-family-name" name="familyName">
        </div>
        <div class="field">
          <label for="self-sex">Sex</label>
          <select id="self-sex" name="sex">
            <option value="">Unspecified</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
          </select>
        </div>
        <div class="field">
          <label for="self-birth-date">Birth date</label>
          <input type="date" id="self-birth-date" name="birthDate">
        </div>
        <div class="field">
          <label for="self-birth-place">Birth place</label>
          <input type="text" id="self-birth-place" name="birthPlace">
        </div>
        <button type="submit" class="btn-primary">Save</button>
      </form>
    </aside>
    <main id="canvas" class="canvas">
      <p class="placeholder" id="canvas-placeholder">Your pedigree tree will render here.</p>
      <div id="tree-root" class="tree-root" hidden></div>
    </main>
  </div>
  <script>
    (function () {
      var STORAGE_KEY = 'qabiiltracker.people';

      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { people: {}, selfId: null };
          var parsed = JSON.parse(raw);
          return {
            people: parsed.people || {},
            selfId: parsed.selfId || null,
          };
        } catch (err) {
          return { people: {}, selfId: null };
        }
      }

      function saveState(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      var state = loadState();
      var PARENT_ROLES = ['father', 'mother'];

      var form = document.getElementById('self-form');
      var formHeading = document.getElementById('form-heading');
      var givenNameInput = document.getElementById('self-given-name');
      var familyNameInput = document.getElementById('self-family-name');
      var sexInput = document.getElementById('self-sex');
      var birthDateInput = document.getElementById('self-birth-date');
      var birthPlaceInput = document.getElementById('self-birth-place');
      var givenNameError = document.getElementById('self-given-name-error');
      var placeholder = document.getElementById('canvas-placeholder');
      var treeRoot = document.getElementById('tree-root');

      // Tracks which record the sidebar form is currently creating/editing.
      // role: 'self' | 'father' | 'mother'; childId: id of the person this
      // role is a parent of (only meaningful for father/mother roles).
      var editing = { role: 'self', personId: state.selfId, childId: null };

      function formatDate(isoDate) {
        var parts = isoDate.split('-').map(Number);
        var year = parts[0], month = parts[1], day = parts[2];
        if (!year || !month || !day) return isoDate;
        var d = new Date(Date.UTC(year, month - 1, day));
        return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });
      }

      function formatBirthDetails(person) {
        var parts = [];
        if (person.birthDate) parts.push(formatDate(person.birthDate));
        if (person.birthPlace) parts.push(person.birthPlace);
        return parts.join(' · ');
      }

      function capitalize(word) {
        return word.charAt(0).toUpperCase() + word.slice(1);
      }

      function renderPersonCard(person) {
        var card = document.createElement('div');
        card.className = 'person-card';
        card.dataset.personId = person.id;

        var name = document.createElement('div');
        name.className = 'person-name';
        name.textContent = [person.givenName, person.familyName].filter(Boolean).join(' ') || 'Unnamed';
        card.appendChild(name);

        var details = formatBirthDetails(person);
        if (details) {
          var detail = document.createElement('div');
          detail.className = 'person-detail';
          detail.textContent = details;
          card.appendChild(detail);
        }

        return card;
      }

      function selectEditing(role, personId, childId) {
        editing = { role: role, personId: personId || null, childId: childId || null };
        formHeading.textContent = role === 'self' ? 'Myself' : capitalize(role);
        populateForm(personId ? state.people[personId] : null);
      }

      function renderSlot(role, person, childId) {
        var el;
        if (person) {
          el = renderPersonCard(person);
          el.classList.add('person-card--clickable');
        } else {
          el = document.createElement('div');
          el.className = 'person-slot-empty';
          el.textContent = '+ Add ' + capitalize(role);
        }
        el.addEventListener('click', function () {
          selectEditing(role, person ? person.id : null, childId);
        });
        return el;
      }

      function elementCenter(el, edge, rootRect) {
        var rect = el.getBoundingClientRect();
        return {
          x: rect.left + rect.width / 2 - rootRect.left,
          y: (edge === 'top' ? rect.top : rect.bottom) - rootRect.top,
        };
      }

      function drawConnector(svg, from, to) {
        var midY = from.y + (to.y - from.y) / 2;
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        var d = 'M ' + from.x + ' ' + from.y +
          ' V ' + midY +
          ' H ' + to.x +
          ' V ' + to.y;
        path.setAttribute('d', d);
        svg.appendChild(path);
      }

      function drawConnectors(svg, self, slotEls) {
        var rootRect = treeRoot.getBoundingClientRect();
        var selfTop = elementCenter(slotEls.self, 'top', rootRect);
        PARENT_ROLES.forEach(function (role) {
          var parentId = self[role + 'Id'];
          if (!parentId) return;
          var from = elementCenter(slotEls[role], 'bottom', rootRect);
          drawConnector(svg, from, selfTop);
        });
      }

      function renderCanvas() {
        treeRoot.innerHTML = '';
        var self = state.selfId ? state.people[state.selfId] : null;
        if (!self) {
          placeholder.hidden = false;
          treeRoot.hidden = true;
          return;
        }
        placeholder.hidden = true;
        treeRoot.hidden = false;

        var parentsTier = document.createElement('div');
        parentsTier.className = 'tree-tier tree-tier-parents';
        var slotEls = {};
        PARENT_ROLES.forEach(function (role) {
          var parentId = self[role + 'Id'];
          var parent = parentId ? state.people[parentId] : null;
          var slotEl = renderSlot(role, parent, self.id);
          slotEls[role] = slotEl;
          parentsTier.appendChild(slotEl);
        });

        var selfTier = document.createElement('div');
        selfTier.className = 'tree-tier tree-tier-self';
        var selfCard = renderPersonCard(self);
        selfCard.classList.add('person-card--clickable');
        selfCard.addEventListener('click', function () {
          selectEditing('self', self.id, null);
        });
        selfTier.appendChild(selfCard);
        slotEls.self = selfCard;

        var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'tree-connectors');

        treeRoot.appendChild(parentsTier);
        treeRoot.appendChild(svg);
        treeRoot.appendChild(selfTier);

        drawConnectors(svg, self, slotEls);
      }

      function populateForm(person) {
        givenNameInput.value = person ? person.givenName || '' : '';
        familyNameInput.value = person ? person.familyName || '' : '';
        sexInput.value = person ? person.sex || '' : '';
        birthDateInput.value = person ? person.birthDate || '' : '';
        birthPlaceInput.value = person ? person.birthPlace || '' : '';
        givenNameError.hidden = true;
        givenNameInput.removeAttribute('aria-invalid');
      }

      function generateId() {
        return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var givenName = givenNameInput.value.trim();

        if (!givenName) {
          givenNameError.hidden = false;
          givenNameInput.setAttribute('aria-invalid', 'true');
          givenNameInput.focus();
          return;
        }
        givenNameError.hidden = true;
        givenNameInput.removeAttribute('aria-invalid');

        var id = editing.personId || generateId();
        var existing = state.people[id] || {};
        var person = {
          id: id,
          givenName: givenName,
          familyName: familyNameInput.value.trim(),
          sex: sexInput.value,
          birthDate: birthDateInput.value,
          birthPlace: birthPlaceInput.value.trim(),
          fatherId: existing.fatherId || null,
          motherId: existing.motherId || null,
        };

        state.people[id] = person;

        if (editing.role === 'self') {
          state.selfId = id;
        } else if (editing.childId) {
          state.people[editing.childId][editing.role + 'Id'] = id;
        }

        editing.personId = id;
        saveState(state);
        populateForm(person);
        renderCanvas();
      });

      givenNameInput.addEventListener('input', function () {
        if (givenNameInput.value.trim()) {
          givenNameError.hidden = true;
          givenNameInput.removeAttribute('aria-invalid');
        }
      });

      window.addEventListener('resize', renderCanvas);

      var initialSelf = state.selfId ? state.people[state.selfId] : null;
      populateForm(initialSelf);
      renderCanvas();
    })();
  </script>
</body>
</html>
